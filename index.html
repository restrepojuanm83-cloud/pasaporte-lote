<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasaporte RWA - Trazabilidad de Lotes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/12.4.0/stellar-sdk.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <header class="border-b border-slate-800 pb-4 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">Pasaporte Digital RWA</h1>
                <p class="text-xs text-slate-400">Verificacion Inmutables en Stellar Soroban & IPFS</p>
            </div>
            <span id="badge-estado" class="px-3 py-1 text-xs font-semibold rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/20">Cargando...</span>
        </header>

        <div id="content" class="space-y-6">
            <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/80">
                <h2 class="text-sm font-medium text-slate-400 mb-1">Identificador del Lote</h2>
                <p id="txt-lote" class="text-lg font-mono font-bold text-slate-200">--</p>
            </div>

            <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/80">
                <h2 class="text-sm font-medium text-slate-400 mb-2">Tridente Documental (IPFS)</h2>
                <div class="grid grid-cols-3 gap-3">
                    <a id="link-coa" href="#" target="_blank" class="block text-center p-2 rounded bg-slate-900 border border-slate-800 text-xs text-sky-400 hover:bg-slate-800 transition">CoA PDF</a>
                    <a id="link-tds" href="#" target="_blank" class="block text-center p-2 rounded bg-slate-900 border border-slate-800 text-xs text-sky-400 hover:bg-slate-800 transition">TDS PDF</a>
                    <a id="link-sds" href="#" target="_blank" class="block text-center p-2 rounded bg-slate-900 border border-slate-800 text-xs text-sky-400 hover:bg-slate-800 transition">SDS PDF</a>
                </div>
            </div>

            <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/80 space-y-2">
                <h2 class="text-sm font-medium text-slate-400">Auditoria en Blockchain</h2>
                <p class="text-xs text-slate-400 truncate"><strong>Tx Emision:</strong> <span id="txt-tx" class="font-mono text-slate-300">--</span></p>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const lote = params.get("lote") || "LOTE-BIOTECH-2026-19";
        const coa = params.get("coa") || "QmXpXg1xEDEPJ8rRjn2QmyM3fiCLFtHG58ECr8GWmxGjYS";
        const tds = params.get("tds") || "QmSx2TK9dv4XFvYSZeChaJMdaktc5pUmBhhQvRo7Zj3mhC";
        const sds = params.get("sds") || "QmRZCuE5ACba4KWL1dakmQZgkWRkJEC5rcoECUNkaMoa1j";
        const tx = params.get("tx") || "78f0ab5c169908c4bc35fe46d33ffd06976736a8603c61bfa70f0c4e2f28b6b9";

        document.getElementById("txt-lote").innerText = lote;
        document.getElementById("link-coa").href = "https://gateway.pinata.cloud/ipfs/" + coa;
        document.getElementById("link-tds").href = "https://gateway.pinata.cloud/ipfs/" + tds;
        document.getElementById("link-sds").href = "https://gateway.pinata.cloud/ipfs/" + sds;
        document.getElementById("txt-tx").innerText = tx;
        document.getElementById("badge-estado").innerText = "En Transito / Verificado";
    </script>
</body>
</html>
